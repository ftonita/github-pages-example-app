<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A warm welcome to our little corner of the web.">
	<title>Welcome</title>
	<style>
		:root {
			color-scheme: light;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172554;
			background: #f8fafc;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			background: radial-gradient(circle at top right, #dbeafe, transparent 40%), #f8fafc;
		}

		main {
			width: min(100%, 680px);
			padding: clamp(2rem, 7vw, 4.5rem);
			text-align: center;
			background: #fff;
			border: 1px solid #e2e8f0;
			border-radius: 1.5rem;
			box-shadow: 0 24px 60px rgb(15 23 42 / 8%);
		}

		.eyebrow {
			margin: 0 0 1rem;
			color: #2563eb;
			font-size: .8rem;
			font-weight: 700;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.5rem, 8vw, 4.5rem);
			line-height: 1.05;
			letter-spacing: -.05em;
		}

		.intro {
			max-width: 470px;
			margin: 1.5rem auto 2rem;
			color: #475569;
			font-size: 1.1rem;
			line-height: 1.7;
		}

		a {
			display: inline-block;
			padding: .85rem 1.25rem;
			color: #fff;
			font-weight: 650;
			text-decoration: none;
			background: #2563eb;
			border-radius: .75rem;
		}

		a:hover { background: #1d4ed8; }
		a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }

		footer {
			margin-top: 2.5rem;
			color: #64748b;
			font-size: .9rem;
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">A little something for you</p>
		<h1>Welcome!</h1>
		<p class="intro">We’re glad you’re here. This is a simple starting point for sharing your ideas, projects, and everything you’re excited about.</p>
		<a href="mailto:hello@example.com">Say hello</a>
		<footer>Made with care, just for the web.</footer>
	</main>
</body>
</html>
