name: Build html pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build:static
      - name: Prepare Pages artifact
        run: |
          output_dir=""
          for candidate in public dist build out docs _site site www; do
            if [ -f "$candidate/index.html" ]; then
              output_dir="$candidate"
              break
            fi
          done
          if [ -z "$output_dir" ]; then
            output_file=$(find . -mindepth 2 -maxdepth 2 -type f -name index.html \
              -not -path './.git/*' -not -path './node_modules/*' -print -quit)
            if [ -n "$output_file" ]; then
              output_dir="${output_file%/*}"
            fi
          fi
          if [ -z "$output_dir" ]; then
            echo "No built site found: build output must contain a top-level index.html" >&2
            exit 1
          fi
          if [ "$output_dir" != public ]; then
            rm -rf public
            mkdir public
            cp -a "$output_dir/." public/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: public/
      

