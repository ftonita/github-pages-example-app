name: Build html pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: mkdir public
      - run: npm install
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: public/
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist/
      

