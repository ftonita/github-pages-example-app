name: Build html pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: mkdir public
      - run: npm install
      - run: npm run build:static
      - run: |
          for dir in dist public; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -print -exec cat {} \;
            fi
          done

